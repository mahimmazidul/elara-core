name: elara_core
description: >
  ELARA — an ensemble menstrual cycle prediction engine for the Elara app.
  Combines multiple open-source prediction methods into a single consensus
  forecast, then classifies cycle phase and generates behavioral guidance
  adjusted for environmental conditions. Pure Dart. No network calls. No
  external services.
version: 0.1.0
homepage: https://github.com/mahimmazidul/elara-core

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies: {}

dev_dependencies:
  test: ^1.24.0
  lints: ^3.0.0
